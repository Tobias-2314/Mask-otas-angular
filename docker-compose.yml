services:
  postgres:
    image: postgres:16-alpine
    container_name: maskotas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maskotas}
      POSTGRES_USER: ${POSTGRES_USER:-maskotas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maskotas123}
    volumes:
      - maskotas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maskotas} -d ${POSTGRES_DB:-maskotas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - maskotas-net

  backend:
    build:
      context: ./maskotas
      dockerfile: Dockerfile
    container_name: maskotas-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maskotas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-maskotas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-maskotas123}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - maskotas-net

  frontend:
    build:
      context: ./maskotas-frontend
      dockerfile: Dockerfile
    container_name: maskotas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - maskotas-net

volumes:
  maskotas_postgres_data:

networks:
  maskotas-net:
    driver: bridge
